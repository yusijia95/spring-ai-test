spring.application.name=house-client-services
server.port=8085
spring.ai.dashscope.api-key=${ALI_BAILIAN_KEY}

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
#spring.ai.chat.memory.repository.jdbc.schema=classpath:/sql/schema-mysql.sql
#logging.level.org.springframework.ai.chat.client.advisor= DEBUG

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:springai}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:mysql}

# Flyway：springai 库中已有 Nacos / spring_ai_chat_memory 等表，属于非空库。
# baseline-on-migrate 会先建基线，baseline-version 必须设为 0，
# 否则默认基线版本为 1，V1__init.sql 会被判定为已执行而直接跳过。
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.ai.chat.memory.redis.host=${REDIS_HOST:localhost}
spring.ai.chat.memory.redis.port=${REDIS_PORT:6379}
spring.ai.chat.memory.redis.password=${REDIS_PWD:null}
spring.ai.chat.memory.redis.timeout=5000

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=debug

