spring.application.name=house-client-services
server.port=8085
spring.ai.dashscope.api-key=${ALI_BAILIAN_KEY}

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
#spring.ai.chat.memory.repository.jdbc.schema=classpath:/sql/schema-mysql.sql
#logging.level.org.springframework.ai.chat.client.advisor= DEBUG

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:springai}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:mysql}

# Flyway：springai 库中已有 Nacos / spring_ai_chat_memory 等表，属于非空库。
# baseline-on-migrate 会先建基线，baseline-version 必须设为 0，
# 否则默认基线版本为 1，V1__init.sql 会被判定为已执行而直接跳过。
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.ai.chat.memory.redis.host=${REDIS_HOST:localhost}
spring.ai.chat.memory.redis.port=${REDIS_PORT:6379}
spring.ai.chat.memory.redis.password=${REDIS_PWD:null}
spring.ai.chat.memory.redis.timeout=5000

# 百度地图 MCP Server — Streamable-HTTP 远程接入
spring.ai.mcp.client.streamable-http.connections.baidu-maps.url=https://mcp.map.baidu.com
spring.ai.mcp.client.streamable-http.connections.baidu-maps.endpoint=/mcp?ak=${BAIDU_DITU_KEY}

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=debug

# ---- 联网检索（博查 Web Search + 可选 qwen3-rerank）----
# 重排是可选能力：账号未开通 / 超时会自动降级为检索原顺序，不影响回答，也不影响其它功能
bocha.api-key=${BOCHA_KEY:}
#bocha.search-url=https://api.bochaai.com/v1/web-search
# 候选池大小；实测博查有时只回 5 条，所以一个问题需要模型换角度多查几次
#bocha.count=20
# 最终给模型看的条数
#bocha.top-n=8
# oneDay / oneWeek / oneMonth / oneYear / threeYear / noLimit
# 默认 threeYear：技术文档、政策沿革往往超过一年仍在用，卡太严会把有效资料过滤掉；
# 代价是招聘、岗位这类时效敏感内容会混进旧页面，所以超过两年的结果会标"信息较旧"
#bocha.freshness=threeYear
#bocha.rerank.enabled=true
#bocha.rerank.url=https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
#bocha.rerank.api-key=${ALI_BAILIAN_KEY:}
#bocha.rerank.model=qwen3-rerank
# 相关度低于该值的检索结果丢弃（不足 3 条时会按分数补足，避免模型无依据可写）
# 0.3 是实测值：0.2 会把"只是提到了同一个产品名"的水文也放进来
#bocha.rerank.min-score=0.3
# 取值 dashscope（默认，{input:{query,documents},parameters:{top_n}}）
# 或 openai（{query,documents,top_n}），换供应商时改这里即可
#bocha.rerank.style=dashscope
# 正文抓取：摘要只有 300 字，配置片段、命令、错误栈往往只在网页正文里。
# 只抓排名前几条，单条 6 秒超时，抓不到就不输出"正文摘录"，不影响回答
#bocha.body-fetch.enabled=true
#bocha.body-fetch.count=3
#bocha.body-fetch.max-chars=1200
# 兜底：直连失败的条目（CSDN 这类 WAF 站点直连 521）改走 Firecrawl，它带无头浏览器能抓下来。
# 不整体替换成 Firecrawl：它单页要十几秒且按页计费，而多数站点直连几百毫秒就够。
# 免费档 1000 credit/月 = 1000 页；一页 1 credit。key 留空时走 keyless 档（按 IP 限流，够试用）
#bocha.body-fetch.firecrawl.enabled=true
#bocha.body-fetch.firecrawl.api-key=${FIRECRAWL_KEY:}
#bocha.body-fetch.firecrawl.url=https://api.firecrawl.dev/v2/scrape
# 一次问答最多为几篇走兜底，防止某轮全是 WAF 站点时既慢又烧额度
#bocha.body-fetch.firecrawl.max-pages=2
#bocha.body-fetch.firecrawl.timeout-ms=20000
# 抓正文的总预算：单条超时之和可能到 28 秒，客户等不起。超预算就用已抓到的部分
#bocha.body-fetch.total-timeout-ms=15000

# ---- Agent Skill 装配 ----
# SKILL.md 扫描位置；新增能力只需加一个 resources/skills/<name>/SKILL.md
#agent.skills.pattern=classpath*:skills/*/SKILL.md
# 意图选择器用的模型（只输出技能名，建议用便宜快的型号）
#agent.skill-selector.model=qwen-turbo
# 检索规划器：把客户一句话拆成几条 query 并发检索（与选择器共用同一个便宜模型）
# 规划失败或返回空时，退回"模型自己调 webSearch"的旧路径
#agent.retrieval.max-queries=3

